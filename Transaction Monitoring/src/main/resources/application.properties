# FIX: use localhost for local dev (not host.docker.internal which is Docker-only).
# When running in Docker, override via env var:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/aml_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aml_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver
